<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenticular Image | Amy Huang</title>
    <style>
        #imageContainer {
            position: relative;
            width: 640px; /* Match the image width */
            height: 480px; /* Match the image height */
        }
        #imageContainer img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* transition: opacity 0.5s ease-in-out; */
            opacity: 0;
        }
        #imageContainer img.visible {
            opacity: 1;
        }
        .row {
            display: flex;
            flex-direction: row;
        }
    </style>
</head>
<body>
    <h1>Taurus Chess Cam</h1>
    <p><a href="https://github.com/amyxjhuang/taurus-cam">Github Repository</a></p>
    <div class="row">
    <video id="webcam" autoplay playsinline width="640" height="480"></video>
    <canvas id="overlay" width="640" height="480"></canvas>
    </div>
    <button id="fullscreenToggle">Toggle Fullscreen</button>
    <div id="imageContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <script src="script.js" type="module"></script> 
</body>
</html>
