<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenticular Image | Amy Huang</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #444;
        }
        p {
            text-align: center;
            margin-bottom: 20px;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        #fullscreenToggle {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #fullscreenToggle:hover {
            background-color: #0056b3;
        }
        #imageContainer {
            position: relative;
            width: 640px;
            height: 480px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        #imageContainer img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            /* transition: opacity 0.5s ease-in-out; */
        }
        #imageContainer img.visible {
            opacity: 1;
        }
        .row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Lenticular Image Using Lightfield Camera</h1>
    <p>[ <a href="https://github.com/amyxjhuang/taurus-cam">Github Repository</a> ]  [ <a href="https://amyxjhuang.notion.site/Lenticular-Printing-1e5449fa8f6f8067b369c88a28e30ea0">Notes</a> ]</p>
    <div class="row">
    <video id="webcam" autoplay playsinline width="640" height="480"></video>
    <canvas id="overlay" width="640" height="480"></canvas>
    </div>
    <button id="fullscreenToggle">Toggle Fullscreen</button>
    <div id="imageContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <script src="script.js" type="module"></script> 
</body>
</html>
